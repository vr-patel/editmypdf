# Builds the site and publishes dist/ to GitHub Pages on every push to main. Before the first run,
# choose "GitHub Actions" as the source under Settings → Pages; README.md ("How a change goes
# live") has the steps. The build takes its base path and address from the Pages configuration, so
# the same workflow serves https://<owner>.github.io/<repo>/ and a custom domain.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run already in progress is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Reads the site's address from the Pages settings: base_path is "/<repo>" for a project site
      # and "" for a user site or a custom domain; base_url is the full address, lowercased as
      # GitHub serves it.
      - name: Read the Pages configuration
        id: pages
        uses: actions/configure-pages@v6
      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional repository variables (Settings → Secrets and variables → Actions → Variables):
          # the Search Console HTML-tag value; a Cloudflare Web Analytics token for a cookieless
          # visit counter; a GA4 measurement id (shown as an opt-in notice on the site's pages).
          # Leave them unset and the site stays script-free.
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_CF_BEACON_TOKEN: ${{ vars.VITE_CF_BEACON_TOKEN }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
